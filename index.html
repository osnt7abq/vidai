<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VidAI — Winter Edition 2025</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700;900&family=DM+Sans:wght@300;400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--gold:#C9A84C;--gold2:#F0D080;--gold3:#8B6914;--bg:#06050A;--surface:#0E0C14;--border:rgba(201,168,76,0.15);--text:#E8DFC0;--muted:#6B6050}
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden}

    /* ══ CINEMATIC INTRO ══ */
    #intro{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
    #intro.out{animation:iOut 1.4s ease forwards;pointer-events:none}
    @keyframes iOut{to{opacity:0;transform:scale(1.04)}}
    .i-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 40% 50%,#1a1206,#000 70%)}
    .i-frame{position:absolute;inset:20px;border:1px solid rgba(201,168,76,.1);pointer-events:none}
    .i-corner{position:absolute;width:44px;height:44px;border-color:rgba(201,168,76,.5);border-style:solid}
    .i-corner.tl{top:-1px;left:-1px;border-width:2px 0 0 2px}
    .i-corner.tr{top:-1px;right:-1px;border-width:2px 2px 0 0}
    .i-corner.bl{bottom:-1px;left:-1px;border-width:0 0 2px 2px}
    .i-corner.br{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
    .i-col{position:absolute;top:0;bottom:0;width:2px;background:repeating-linear-gradient(180deg,rgba(201,168,76,.3) 0,transparent 40px,rgba(201,168,76,.15) 80px);opacity:.15}
    .i-col-l{left:56px}.i-col-r{right:56px}
    #iStars{position:absolute;inset:0;pointer-events:none}
    .istar{position:absolute;background:var(--gold);border-radius:50%;animation:twk ease-in-out infinite}
    @keyframes twk{0%,100%{opacity:0;transform:scale(0)}50%{opacity:.7;transform:scale(1)}}
    .i-laurel-l,.i-laurel-r{position:absolute;top:50%;font-size:80px;opacity:0;filter:drop-shadow(0 0 16px rgba(201,168,76,.3));transition:opacity .5s}
    .i-laurel-l{left:6%;transform:translateY(-50%) scaleX(-1) rotate(15deg)}
    .i-laurel-r{right:6%;transform:translateY(-50%) rotate(15deg)}
    .i-content{position:relative;z-index:2;text-align:center}
    .i-year{font-family:'Cinzel',serif;font-size:10px;letter-spacing:8px;color:rgba(201,168,76,.3);margin-bottom:18px;animation:fUp .6s ease .3s both}
    .i-embl{width:76px;height:76px;border:1px solid rgba(201,168,76,.3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--gold);margin:0 auto 20px;animation:ePop .8s cubic-bezier(.34,1.56,.64,1) .5s both;background:rgba(201,168,76,.04);position:relative}
    .i-embl::before{content:'';position:absolute;inset:-5px;border:1px solid rgba(201,168,76,.08);border-radius:50%}
    @keyframes ePop{from{transform:scale(0) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
    .i-brand{font-family:'Cinzel Decorative',serif;font-size:clamp(52px,13vw,108px);letter-spacing:6px;background:linear-gradient(135deg,#6B4E0A,#C9A84C,#F0D080,#C9A84C,#6B4E0A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:bIn 1s ease .9s both;line-height:1}
    @keyframes bIn{from{opacity:0;transform:translateY(28px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
    .i-divider{display:flex;align-items:center;gap:14px;width:260px;margin:14px auto;animation:fUp .6s ease 1.4s both}
    .i-dl{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.4),transparent)}
    .i-tag{font-family:'Cinzel',serif;font-size:10px;letter-spacing:4px;color:rgba(201,168,76,.4);animation:fUp .6s ease 1.6s both}
    .i-bar{width:180px;height:1px;background:rgba(255,255,255,.04);margin:26px auto 0;overflow:hidden;animation:fUp .4s ease 1.8s both}
    .i-bar-fill{height:100%;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:bFill 2.2s ease 2s forwards}
    @keyframes bFill{from{width:0;opacity:0}to{width:100%;opacity:1}}
    .i-skip{position:absolute;bottom:24px;right:24px;font-family:'Cinzel',serif;font-size:9px;letter-spacing:3px;color:rgba(201,168,76,.25);border:1px solid rgba(201,168,76,.12);padding:7px 16px;cursor:pointer;transition:all .3s;animation:fUp .4s ease 2.5s both}
    .i-skip:hover{color:var(--gold);border-color:rgba(201,168,76,.4)}
    @keyframes fUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

    /* ══ SITE ══ */
    #site{opacity:0;transition:opacity 1.2s ease}
    #site.on{opacity:1}

    /* ══ NAV ══ */
    nav{position:fixed;top:0;left:0;right:0;z-index:500;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;transition:all .4s}
    nav.scrolled{background:rgba(6,5,10,.94);backdrop-filter:blur(20px);border-bottom:1px solid rgba(201,168,76,.1)}
    .nav-left{display:flex;align-items:center;gap:14px}
    .nav-embl{width:38px;height:38px;border:1px solid rgba(201,168,76,.35);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:16px;flex-shrink:0}
    .nav-brand-wrap .nb{font-family:'Cinzel Decorative',serif;font-size:17px;color:var(--gold2);letter-spacing:2px}
    .nav-brand-wrap .ne{font-family:'Cinzel',serif;font-size:7px;color:var(--muted);letter-spacing:2px}
    .nav-center{display:flex;align-items:center;gap:32px}
    .nav-link{font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;color:var(--muted);text-decoration:none;transition:color .3s;cursor:pointer}
    .nav-link:hover{color:var(--gold)}
    .nav-right{display:flex;align-items:center;gap:14px}
    .nav-login{font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;color:var(--muted);cursor:pointer;transition:color .3s}
    .nav-login:hover{color:var(--gold)}
    .nav-cta{background:linear-gradient(135deg,var(--gold3),var(--gold));color:#1a1200;font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;padding:10px 22px;border:none;cursor:pointer;transition:all .3s;white-space:nowrap}
    .nav-cta:hover{box-shadow:0 0 20px rgba(201,168,76,.3);transform:translateY(-1px)}

    /* Side dots */
    .side-nav{position:fixed;right:28px;top:50%;transform:translateY(-50%);z-index:200;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
    .sdot{display:flex;align-items:center;gap:10px;cursor:pointer}
    .sdot-circle{width:6px;height:6px;border-radius:50%;border:1px solid rgba(201,168,76,.25);transition:all .3s}
    .sdot-label{font-family:'Cinzel',serif;font-size:7px;letter-spacing:2px;color:rgba(201,168,76,.25);opacity:0;transition:opacity .3s;white-space:nowrap}
    .sdot:hover .sdot-circle,.sdot.active .sdot-circle{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px rgba(201,168,76,.4)}
    .sdot:hover .sdot-label,.sdot.active .sdot-label{opacity:1;color:rgba(201,168,76,.5)}

    /* ══ HERO (01) ══ */
    #sec01{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden}

    /* Roman emperor AI image as background */
    .hero-img{position:absolute;inset:0;background:
      url('https://image.pollinations.ai/prompt/Roman%20Emperor%20Julius%20Caesar%20marble%20statue%20bust%20dramatic%20cinematic%20lighting%20dark%20background%20epic%20golden%20hour%20colosseum%20smoke%20fog%20ultra%20realistic%204K%20film%20photography?width=1400&height=900&nologo=true&seed=42') center/cover no-repeat;
      filter:brightness(.5) saturate(.8)}
    .hero-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,5,10,.92) 40%,rgba(6,5,10,.4) 100%)}
    .hero-overlay2{position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(6,5,10,.95) 100%)}

    /* Particles */
    .hero-ptcls{position:absolute;inset:0;pointer-events:none}
    .hptcl{position:absolute;width:1px;height:1px;background:var(--gold);animation:hpFloat linear infinite;opacity:0}
    @keyframes hpFloat{0%{transform:translateY(100vh);opacity:0}10%{opacity:.5}90%{opacity:.5}100%{transform:translateY(-50px);opacity:0}}

    .hero-content{position:relative;z-index:2;max-width:660px;padding:140px 48px 80px}
    .hero-ey{font-family:'Cinzel',serif;font-size:10px;letter-spacing:4px;color:rgba(201,168,76,.6);margin-bottom:20px;display:flex;align-items:center;gap:10px}
    .hero-ey::before{content:'';width:28px;height:1px;background:rgba(201,168,76,.5)}
    .hero-h1{font-family:'Cinzel Decorative',serif;font-size:clamp(32px,5.5vw,64px);line-height:1.05;margin-bottom:0;letter-spacing:1px}
    .hero-h1 .ww{display:block;color:#fff;font-size:1em}
    .hero-h1 .wg{display:block;background:linear-gradient(135deg,var(--gold3),var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:1em}
    .hero-p{font-family:'EB Garamond',serif;font-size:17px;color:rgba(232,223,192,.5);line-height:1.8;max-width:440px;margin:22px 0 36px;font-style:italic}
    .hero-btns{display:flex;gap:14px;flex-wrap:wrap}
    .btn-primary{background:linear-gradient(135deg,var(--gold3),var(--gold));color:#1a1200;font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;padding:15px 30px;border:none;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
    .btn-primary::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transform:translateX(-100%);transition:transform .5s}
    .btn-primary:hover::before{transform:translateX(100%)}
    .btn-primary:hover{box-shadow:0 8px 28px rgba(201,168,76,.3);transform:translateY(-1px)}
    .btn-secondary{background:transparent;color:rgba(201,168,76,.6);font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;padding:15px 30px;border:1px solid rgba(201,168,76,.25);cursor:pointer;transition:all .3s;display:flex;align-items:center;gap:8px}
    .btn-secondary:hover{border-color:rgba(201,168,76,.5);color:var(--gold)}

    /* Stats bar */
    .hero-stats{display:flex;gap:0;margin-top:56px;padding-top:28px;border-top:1px solid rgba(201,168,76,.1);flex-wrap:wrap}
    .hst{flex:1;min-width:110px;padding-right:28px;border-right:1px solid rgba(201,168,76,.08)}
    .hst:last-child{border-right:none}
    .hst-icon{font-size:16px;margin-bottom:8px;opacity:.6}
    .hst-num{font-family:'Cinzel Decorative',serif;font-size:22px;color:var(--gold);display:block;letter-spacing:1px}
    .hst-label{font-family:'Cinzel',serif;font-size:7px;letter-spacing:2px;color:var(--muted);margin-top:4px;display:block}

    /* Scroll indicator */
    .scroll-ind{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;animation:bob 2s ease-in-out infinite}
    .scroll-ind span{font-family:'Cinzel',serif;font-size:7px;letter-spacing:3px;color:rgba(201,168,76,.3)}
    .scroll-line{width:1px;height:36px;background:linear-gradient(180deg,rgba(201,168,76,.4),transparent)}
    @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(6px)}}

    /* ══ REVEAL ANIMATION ══ */
    .reveal{opacity:0;transform:translateY(50px) perspective(800px) rotateX(6deg);transform-origin:top center;transition:all 1.1s cubic-bezier(.25,.46,.45,.94)}
    .reveal.on{opacity:1;transform:translateY(0) perspective(800px) rotateX(0deg)}

    /* Stagger children */
    .reveal .r1{transition-delay:.1s}
    .reveal .r2{transition-delay:.25s}
    .reveal .r3{transition-delay:.4s}
    .reveal .r4{transition-delay:.55s}
    .reveal .r5{transition-delay:.7s}
    .reveal .r6{transition-delay:.85s}

    /* ══ SEC 02: TOOLS ══ */
    #sec02{padding:100px 48px;background:linear-gradient(180deg,var(--bg),#0c0a12 50%,var(--bg));position:relative;overflow:hidden}
    .sec-num{position:absolute;font-family:'Cinzel Decorative',serif;font-size:90px;color:rgba(201,168,76,.04);pointer-events:none;letter-spacing:-2px}
    .sec-num.tl{top:40px;left:40px}
    .sec-ey{font-family:'Cinzel',serif;font-size:9px;letter-spacing:4px;color:rgba(201,168,76,.5);margin-bottom:12px;display:flex;align-items:center;gap:10px}
    .sec-ey::before{content:'';width:18px;height:1px;background:rgba(201,168,76,.4)}
    .sec-h{font-family:'Cinzel Decorative',serif;font-size:clamp(24px,4vw,44px);color:var(--text);margin-bottom:8px;line-height:1.1}
    .sec-p{font-family:'EB Garamond',serif;font-style:italic;color:var(--muted);font-size:15px;margin-bottom:36px}

    .sec02-inner{display:grid;grid-template-columns:280px 1fr;gap:60px;align-items:start;max-width:1100px;margin:0 auto}
    .tools-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .tool-card{background:rgba(201,168,76,.02);border:1px solid rgba(201,168,76,.07);padding:20px 18px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
    .tool-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.3),transparent);opacity:0;transition:opacity .3s}
    .tool-card:hover{border-color:rgba(201,168,76,.18);background:rgba(201,168,76,.05);transform:translateY(-3px)}
    .tool-card:hover::before{opacity:1}

    /* Tool image */
    .tool-img{width:100%;height:100px;object-fit:cover;margin-bottom:12px;filter:sepia(.3) saturate(.7);opacity:.7;transition:all .3s}
    .tool-card:hover .tool-img{opacity:1;filter:sepia(.1) saturate(.9)}
    .tool-name{font-family:'Cinzel',serif;font-size:10px;letter-spacing:1px;color:var(--gold2);margin-bottom:6px}
    .tool-desc{font-family:'EB Garamond',serif;font-size:12px;color:var(--muted);line-height:1.5;font-style:italic}
    .tool-arr{font-size:14px;color:rgba(201,168,76,.25);margin-top:10px;display:block;transition:all .3s}
    .tool-card:hover .tool-arr{transform:translateX(4px);color:var(--gold)}
    .view-btn{background:transparent;border:1px solid rgba(201,168,76,.2);color:rgba(201,168,76,.5);font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;padding:10px 22px;cursor:pointer;transition:all .3s;margin-top:24px}
    .view-btn:hover{border-color:rgba(201,168,76,.4);color:var(--gold)}

    /* ══ SEC 03: CINEMATIC / SHOWCASE ══ */
    #sec03{position:relative;min-height:70vh;display:flex;align-items:center;overflow:hidden}
    .sec03-bg{position:absolute;inset:0;background:
      url('https://image.pollinations.ai/prompt/Epic%20Roman%20battle%20scene%20cinematic%20golden%20dramatic%20light%20army%20warriors%20colosseum%20sunset%20smoke%20ultra%20realistic%20film%20photography%204K?width=1400&height=800&nologo=true&seed=77') center/cover no-repeat;
      filter:brightness(.25) saturate(.6)}
    .sec03-ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,5,10,.7) 0%,rgba(6,5,10,.5) 50%,rgba(6,5,10,.9) 100%)}
    .sec03-content{position:relative;z-index:2;text-align:center;padding:80px 48px;width:100%}
    .sec03-content .sec-h{font-size:clamp(28px,5vw,56px);margin-bottom:16px}
    .sec03-content .sec-p{font-size:17px;max-width:480px;margin:0 auto 32px}
    .explore-btn{background:transparent;border:1px solid rgba(201,168,76,.3);color:rgba(201,168,76,.6);font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;padding:13px 28px;cursor:pointer;transition:all .3s;margin-bottom:40px}
    .explore-btn:hover{border-color:rgba(201,168,76,.6);color:var(--gold)}

    /* Thumbnail strip */
    .thumb-strip{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:900px;margin:0 auto}
    .thumb-item-img{flex:1;min-width:120px;max-width:180px;height:90px;position:relative;overflow:hidden;cursor:pointer}
    .thumb-item-img img{width:100%;height:100%;object-fit:cover;filter:sepia(.4) saturate(.6) brightness(.7);transition:all .4s}
    .thumb-item-img:hover img{filter:none;transform:scale(1.05)}
    .thumb-item-img.active-thumb{border:1px solid rgba(201,168,76,.5)}
    .thumb-item-img.active-thumb img{filter:none}

    /* ══ SEC 04: NAPOLEON / GENERATOR ══ */
    #sec04{position:relative;overflow:hidden;padding:0}
    .sec04-bg{position:absolute;inset:0;background:
      url('https://image.pollinations.ai/prompt/Napoleon%20Bonaparte%20portrait%20painting%20cinematic%20dramatic%20dark%20background%20golden%20military%20uniform%20epic%20oil%20painting%20style%20moody%20lighting?width=1400&height=900&nologo=true&seed=55') right/50% no-repeat;
      filter:brightness(.2) saturate(.5)}
    .sec04-ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,5,10,.98) 50%,rgba(6,5,10,.6) 100%)}
    .sec04-inner{position:relative;z-index:2;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;padding:80px 48px}

    .sec04-info .sec-h{font-size:clamp(22px,3.5vw,38px);margin-bottom:14px}
    .sec04-info .sec-p{margin-bottom:28px}

    /* Generator card */
    .gen-card{background:linear-gradient(180deg,rgba(16,14,10,.97),rgba(10,9,6,.99));border:1px solid rgba(201,168,76,.12);position:relative;overflow:hidden}
    .gen-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),rgba(79,195,247,.4),var(--gold),transparent)}
    .gen-hdr{background:rgba(201,168,76,.03);border-bottom:1px solid rgba(201,168,76,.08);padding:14px 24px;display:flex;align-items:center;gap:8px}
    .gdot{width:10px;height:10px;border-radius:50%}
    .gdr{background:#FF5F57}.gdy{background:#FFBD2E}.gdg{background:#28C840}
    .g-tb{margin-left:10px;font-family:'Cinzel',serif;font-size:8px;color:#3a3520;letter-spacing:2px}
    .gen-body{padding:28px}
    .g-lbl{font-family:'Cinzel',serif;font-size:8px;letter-spacing:2px;color:rgba(201,168,76,.32);margin-bottom:8px;display:flex;align-items:center;gap:8px}
    .g-lbl::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(201,168,76,.08),transparent)}
    textarea{width:100%;background:rgba(255,255,255,.02);border:1px solid rgba(201,168,76,.1);padding:14px 16px;color:var(--text);font-size:14px;font-family:'EB Garamond',serif;outline:none;transition:all .3s;resize:none;line-height:1.7}
    textarea:focus{border-color:rgba(201,168,76,.28);box-shadow:0 0 0 3px rgba(201,168,76,.04)}
    textarea::placeholder{color:#3a3520;font-style:italic}
    .dur-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
    .dur-btn{background:rgba(201,168,76,.02);border:1px solid rgba(201,168,76,.07);color:var(--muted);padding:10px 4px;cursor:pointer;font-family:'Cinzel',serif;transition:all .2s;text-align:center}
    .dur-btn:hover{border-color:rgba(201,168,76,.2);color:var(--gold2)}
    .dur-btn.active{background:rgba(201,168,76,.08);border-color:rgba(201,168,76,.3);color:var(--gold)}
    .dur-btn .dn{font-size:16px;font-weight:800;display:block;font-family:'Cinzel Decorative',serif;line-height:1}
    .dur-btn .ds{font-size:7px;opacity:.5;margin-top:2px;letter-spacing:1px;display:block}
    .dur-info{background:rgba(201,168,76,.03);border:1px solid rgba(201,168,76,.07);padding:8px 14px;font-family:'Cinzel',serif;font-size:8px;color:rgba(201,168,76,.32);display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;letter-spacing:1px}
    .dur-info b{color:var(--gold)}
    .sty-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:20px}
    .sty-btn{background:rgba(201,168,76,.02);border:1px solid rgba(201,168,76,.07);color:var(--muted);padding:11px 12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;display:flex;align-items:center;gap:10px}
    .sty-btn:hover{border-color:rgba(201,168,76,.18);color:var(--text)}
    .sty-btn.active{background:rgba(201,168,76,.06);border-color:rgba(201,168,76,.25);color:var(--text)}
    .sty-btn .si{font-size:18px}
    .sty-btn .sn2{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.5px}
    .sty-btn .sd2{font-size:9px;opaci
