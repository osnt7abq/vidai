<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPERIAL AI // Script & Vision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,900&family=Inter:wght@300;400;600;800&display=swap');
        
        :root {
            --roman-gold: #D4AF37;
            --imperial-blue: #1a2a3a;
            --marble: #f4f4f4;
        }

        body { 
            background-color: #0a0a0a; 
            color: var(--marble); 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            background-image: radial-gradient(circle at top right, rgba(26, 42, 58, 0.5), transparent),
                              radial-gradient(circle at bottom left, rgba(212, 175, 55, 0.05), transparent);
        }

        .serif { font-family: 'Playfair Display', serif; }

        .glass { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .gold-border { border: 1px solid rgba(212, 175, 55, 0.3); }
        
        .gold-text {
            background: linear-gradient(135deg, #D4AF37 0%, #FFF5CC 50%, #B8860B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .marble-panel {
            background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            border-radius: 24px;
        }

        .btn-imperial {
            background: linear-gradient(to right, #D4AF37, #B8860B);
            color: #000;
            transition: all 0.3s ease;
            font-weight: 800;
            letter-spacing: 0.1em;
        }

        .btn-imperial:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        /* Statuesque Background element */
        .caeser-bg {
            position: fixed;
            right: -10%;
            bottom: -5%;
            font-size: 40rem;
            opacity: 0.03;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="caeser-bg serif">SPQR</div>

    <!-- NAVIGATION -->
    <nav class="fixed top-0 left-0 w-full z-50 glass px-8 py-5 flex justify-between items-center border-b border-white/5">
        <div class="flex items-center space-x-3">
            <span class="text-2xl serif font-black italic gold-text tracking-tighter">IMPERIAL AI</span>
        </div>
        <div class="hidden md:flex space-x-8 text-[10px] uppercase font-bold tracking-[0.3em] text-gray-400">
            <a href="#" class="hover:text-white transition">Scriptorium</a>
            <a href="#" class="hover:text-white transition">Vision Lab</a>
            <a href="#" class="hover:text-white transition">The Archive</a>
        </div>
        <button class="glass px-6 py-2 rounded-full text-[10px] font-black uppercase gold-border hover:bg-white/5 transition">Empire Login</button>
    </nav>

    <!-- DASHBOARD GRID -->
    <main class="mt-24 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- LEFT: USER STATUS (3 Cols) -->
        <div class="lg:col-span-3 space-y-6">
            <div class="glass p-8 rounded-[32px] gold-border text-center">
                <div class="w-24 h-24 mx-auto bg-white/5 rounded-full mb-4 flex items-center justify-center border border-white/10">
                    <i class="fa-solid fa-crown text-3xl gold-text"></i>
                </div>
                <h2 class="serif text-xl italic mb-1">Ave, Commander.</h2>
                <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-6">Imperial Rank: Augustus</p>
                
                <div class="bg-white/5 p-4 rounded-2xl text-left border border-white/5">
                    <div class="text-[9px] text-gray-500 uppercase mb-1">Generator Power</div>
                    <div class="text-lg font-bold">14,250 <span class="text-[10px] text-indigo-400 font-normal">Credits</span></div>
                </div>
            </div>

            <div class="glass p-6 rounded-[32px] opacity-60">
                <h3 class="text-[10px] font-black uppercase tracking-[0.2em] mb-4 text-gray-500">Live Network</h3>
                <div class="space-y-4">
                    <div class="flex justify-between items-center text-xs">
                        <span>Script Engine</span>
                        <span class="text-green-500 font-bold">Online</span>
                    </div>
                    <div class="flex justify-between items-center text-xs">
                        <span>Image Render</span>
                        <span class="text-green-500 font-bold">Online</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- CENTER: GENERATOR CORE (6 Cols) -->
        <div class="lg:col-span-6 space-y-6">
            <div class="glass p-10 rounded-[40px] gold-border relative overflow-hidden">
                <!-- Inner Marble Texture Glow -->
                <div class="absolute -top-20 -right-20 w-64 h-64 bg-indigo-500/10 rounded-full blur-[100px]"></div>

                <h1 class="serif text-4xl italic mb-8 gold-text">Build Your <br><span class="text-white not-italic font-black uppercase tracking-tighter">Empire.</span></h1>
                
                <div class="space-y-6">
                    <div>
                        <label class="text-[10px] uppercase tracking-[0.3em] text-gray-500 mb-3 block">1. The Narrative Script</label>
                        <textarea id="scriptInput" placeholder="Enter your prompt... 'A story of the conquest of distant galaxies'..." 
                            class="w-full h-48 bg-black/40 border border-white/10 rounded-3xl p-6 outline-none focus:border-[#D4AF37] transition text-white leading-relaxed text-sm"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <button class="bg-white/5 border border-white/10 p-4 rounded-2xl text-center hover:bg-white/10 transition">
                            <i class="fa-solid fa-feather-pointed mb-2 gold-text"></i>
                            <div class="text-[10px] uppercase font-bold">Script Mode</div>
                        </button>
                        <button class="bg-white/5 border border-white/10 p-4 rounded-2xl text-center hover:bg-white/10 transition">
                            <i class="fa-solid fa-palette mb-2 gold-text"></i>
                            <div class="text-[10px] uppercase font-bold">Visual Mode</div>
                        </button>
                    </div>

                    <button onclick="generateEmpire()" class="w-full btn-imperial py-6 rounded-3xl uppercase text-xs">Execute Generation</button>
                </div>
            </div>

            <!-- RESULT GALLERY -->
            <div id="gallery" class="grid grid-cols-2 gap-4">
                <div class="glass aspect-square rounded-3xl overflow-hidden relative group">
                    <img src="https://images.unsplash.com/photo-1545641203-7d072a14e3b2?q=80&w=1000" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition duration-700">
                    <div class="absolute bottom-4 left-4">
                        <span class="text-[8px] bg-black/60 px-2 py-1 rounded uppercase">Image 01</span>
                    </div>
                </div>
                <div class="glass aspect-square rounded-3xl overflow-hidden relative group">
                    <img src="https://images.unsplash.com/photo-1503192851959-c6da8ac80cff?q=80&w=1000" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition duration-700">
                    <div class="absolute bottom-4 left-4">
                        <span class="text-[8px] bg-black/60 px-2 py-1 rounded uppercase">Image 02</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT: TERMINAL & ACTIVITY (3 Cols) -->
        <div class="lg:col-span-3 space-y-6">
            <div class="glass p-6 rounded-[32px] flex flex-col h-full min-h-[400px]">
                <h3 class="serif text-xs italic mb-4">The Scriptorium Log</h3>
                <div id="terminal" class="m
